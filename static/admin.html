<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>KodNaqi Admin</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
  .tabs button{flex:1;padding:9px;font-size:12px;border-radius:10px}
  .tabs button.active{background:var(--accent2);color:#fff}
  .warn{background:rgba(242,169,59,.15);border:1px solid var(--accent);padding:12px;border-radius:10px;margin:10px 0;font-size:13px}
</style>
<script>
document.documentElement.dataset.theme = localStorage.getItem('kq-theme') || 'dark';
</script>
</head>
<body>
<div class="wrap">
  <div class="topbar"><b style="color:var(--accent)">KodNaqi Admin</b></div>
  <div id="root"></div>
</div>
<script>
let admin = false;
async function api(u,o={}){o.credentials='same-origin';if(o.json){o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(o.json);delete o.json}const r=await fetch(u,o);return r.json();}

function loginView(){
  document.getElementById('root').innerHTML = `
    <h2>دخول الأدمن</h2>
    <div class="card">
      <input type="password" id="pw" placeholder="كلمة السر (SECRET_KEY)">
      <button onclick="doLogin()">دخول</button>
    </div>`;
}
async function doLogin(){
  const r = await api('/api/admin/login',{method:'POST',json:{password:document.getElementById('pw').value}});
  if(r.ok){admin=true;mainView();}else{alert('كلمة سر خاطئة');}
}

function mainView(){
  document.getElementById('root').innerHTML = `
    <div class="tabs">
      <button class="active" onclick="loadKeys()">المفاتيح</button>
      <button onclick="loadBooks()">الكتب</button>
    </div>
    <div id="panel"></div>`;
  loadKeys();
}

async function loadKeys(){
  document.getElementById('panel').innerHTML = `
    <div class="card">
      <h3>إنشاء مفتاح طالب</h3>
      <input id="sname" placeholder="اسم الطالب">
      <input id="sphone" placeholder="رقم الهاتف">
      <input id="skey" placeholder="المفتاح (مثال: KQ-001)">
      <button onclick="createKey()">إنشاء المفتاح</button>
      <div id="msg" style="margin-top:10px;font-weight:bold"></div>
    </div>`;
}

async function createKey(){
  const btn = event.target;
  btn.disabled = true; btn.textContent = 'جاري الإنشاء...';
  const r = await api('/api/admin/keys',{method:'POST',json:{
    key: document.getElementById('skey').value,
    name: document.getElementById('sname').value,
    phone: document.getElementById('sphone').value
  }});
  btn.disabled = false; btn.textContent = 'إنشاء المفتاح';
  const msg = document.getElementById('msg');
  if(r.ok){ msg.style.color = '#2fbf71'; msg.textContent = '✅ تم إنشاء المفتاح بنجاح!'; }
  else { msg.style.color = '#e05c5c'; msg.textContent = '❌ خطأ: ' + (r.error||''); }
}

function loadBooks(){
  document.getElementById('panel').innerHTML = `
    <div class="card">
      <div class="warn">⚠️ ملاحظة هامة: منصة Vercel لا تقبل رفع ملفات أكبر من 4 ميجا من المتصفح. لرفع كتبك الكبيرة، استخدم سكربت الترمكس.</div>
      <h3>رفع كتاب (للملفات الصغيرة فقط)</h3>
      <input id="title" placeholder="عنوان الكتاب">
      <input type="file" id="pdf" accept="application/pdf">
      <button onclick="uploadBook()">رفع</button>
      <div id="msg" style="margin-top:10px"></div>
    </div>`;
}

async function uploadBook(){
  const f = document.getElementById('pdf').files[0];
  const msg = document.getElementById('msg');
  if(!f) { msg.textContent = 'اختر ملفاً'; return; }
  if(f.size > 4.5 * 1024 * 1024) {
    msg.style.color = '#e05c5c';
    msg.textContent = '❌ الملف كبير جداً! استخدم سكربت الترمكس لرفعه.';
    return;
  }
  const fd = new FormData(); fd.append('pdf', f); fd.append('title', document.getElementById('title').value);
  msg.textContent = 'جاري الرفع...';
  const r = await fetch('/api/admin/upload',{method:'POST',body:fd});
  const j = await r.json();
  msg.style.color = j.ok ? '#2fbf71' : '#e05c5c';
  msg.textContent = j.ok ? '✅ تم الرفع' : '❌ ' + j.error;
}

loginView();
</script>
</body>
</html>
