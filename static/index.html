<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KodNaqi Library</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/style.css">
<script>
document.documentElement.dataset.theme = localStorage.getItem('kq-theme') || 'dark';
var l = localStorage.getItem('kq-lang') || 'ar';
document.documentElement.lang = l;
document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
</script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <b style="color:var(--accent)">📚 KodNaqi Library</b>
    <div class="ctrl">
      <button onclick="toggleTheme()" id="themeBtn">🌙</button>
      <button onclick="toggleLang()" id="langBtn">EN</button>
    </div>
  </div>
  <div id="root"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
